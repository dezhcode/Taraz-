name: Build Android APK

on:
  push:
    branches: [ "main", "master", "ccr-5f01d8c3-19cpg7" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 'current'

      - name: Prepare .env and local.properties for secrets-gradle-plugin
        # کلید Gemini دیگر داخل APK گذاشته نمی‌شود (برنامه از آن استفاده نمی‌کند و هر کس APK را باز کند می‌بیندش)
        run: |
          echo "GEMINI_API_KEY=DUMMY_API_KEY" > .env
          cat .env >> local.properties

      - name: Restore fixed debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            # Same signing key every build, so a new APK installs as an update
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
            echo "Using fixed debug keystore from secrets"
          elif [ ! -f debug.keystore ]; then
            echo "::warning::DEBUG_KEYSTORE_BASE64 secret not set; generating a temporary keystore (APK cannot update a previous install)"
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Test money logic
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew testDebugUnitTest --tests 'com.example.logic.*' --stacktrace
          else
            gradle testDebugUnitTest --tests 'com.example.logic.*' --stacktrace
          fi

      - name: Build Debug APK
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Taraz-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build Release APK (Myket)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            echo "Signing release with the key from secrets"
          else
            export KEYSTORE_PATH="$RUNNER_TEMP/missing.jks"
            echo "::warning::RELEASE_KEYSTORE_BASE64 not set; building an UNSIGNED release APK (not uploadable to Myket)"
          fi
          if [ -f ./gradlew ]; then chmod +x ./gradlew; ./gradlew assembleRelease --stacktrace; else gradle assembleRelease --stacktrace; fi
          mkdir -p out
          for f in app/build/outputs/apk/release/*.apk; do
            case "$f" in
              *unsigned*) cp "$f" out/Taraz-24.0.1-release-unsigned.apk ;;
              *) cp "$f" out/Taraz-24.0.1-myket.apk ;;
            esac
          done
          # نسخهٔ آزمایشی همان بیلد انتشار (کوچک‌شده با R8) با کلید ثابت دیباگ، فقط برای نصب و امتحان روی گوشی
          if [ -f out/Taraz-24.0.1-release-unsigned.apk ] && [ -f debug.keystore ]; then
            BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
            "$BT/apksigner" sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android \
              --ks-key-alias androiddebugkey --out out/Taraz-24.0.1-test.apk out/Taraz-24.0.1-release-unsigned.apk
          fi
          ls -la out
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Tour screenshots
        continue-on-error: true
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; ./gradlew testDebugUnitTest --tests 'com.example.shots.*' -Proborazzi.test.record=true; else gradle testDebugUnitTest --tests 'com.example.shots.*' -Proborazzi.test.record=true; fi
          ls -la app/build/tourshots || true

      - name: Publish APK to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Taraz build ${{ github.run_number }} (${{ github.ref_name }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: |
            app/build/outputs/apk/debug/*.apk
            out/*.apk
            app/build/tourshots/*.png
